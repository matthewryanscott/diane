[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diane"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
dependencies = [
    "cyclopts>=3",
    "httpx>=0.27",
    "pyyaml>=6",
    "rich>=13",
    "scribe",
]

[project.scripts]
diane = "diane.cli:app"

[tool.uv.sources]
scribe = { path = "scribe" }

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "D",
    "ISC001",
    "T201",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
